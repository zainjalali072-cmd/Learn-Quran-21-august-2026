<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth Quran Academy - Premium Online Quran Learning</title>
    <meta name="description" content="Premium online Quran academy offering Tajweed, Hifz, Arabic, and Islamic studies with certified tutors." />
    <!-- Favicon & Site Icons for Google Search & Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden HTML5 Audio Element for Maximum Browser & Mobile Autoplay Compatibility -->
    <audio id="quran-audio-opening" src="/assets/audio/taawwuz_bismillah.mp3" preload="auto" playsinline webkit-playsinline="true" x5-playsinline="true" style="position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;"></audio>

    <!-- Taawwuz & Bismillah Opening Recitation (Rock-Solid for Mobile & PC/Laptop) -->
    <script>
      (function() {
        var AUDIO_PATH = "/assets/audio/taawwuz_bismillah.mp3";
        var audio = document.getElementById("quran-audio-opening");
        if (!audio) {
          audio = new Audio(AUDIO_PATH);
          audio.id = "quran-audio-opening";
          audio.preload = "auto";
          audio.style.cssText = "position:fixed;bottom:0;right:0;width:1px;height:1px;opacity:0.01;pointer-events:none;";
          document.body.appendChild(audio);
        }

        audio.setAttribute("playsinline", "true");
        audio.setAttribute("webkit-playsinline", "true");
        audio.setAttribute("x5-playsinline", "true");
        audio.volume = 1.0;

        var hasPlayedWithSound = false;
        var audioCtx = null;
        var audioBuffer = null;
        var bufferLoading = false;

        function getAudioContext() {
          if (!audioCtx) {
            var CtxClass = window.AudioContext || window.webkitAudioContext;
            if (CtxClass) {
              try {
                audioCtx = new CtxClass();
                window._quranAudioCtx = audioCtx;
              } catch (e) {}
            }
          }
          return audioCtx;
        }

        // Preload ArrayBuffer in background for 0ms Web Audio fallback
        function preloadBuffer() {
          if (bufferLoading || audioBuffer || typeof fetch !== "function") return;
          bufferLoading = true;
          fetch(AUDIO_PATH)
            .then(function(r) { return r.arrayBuffer(); })
            .then(function(buf) {
              var ctx = getAudioContext();
              if (ctx) {
                return ctx.decodeAudioData(buf).then(function(decoded) {
                  audioBuffer = decoded;
                });
              }
            })
            .catch(function() {})
            .finally(function() { bufferLoading = false; });
        }

        // Start preloading immediately
        preloadBuffer();

        function playWebAudioBuffer() {
          var ctx = getAudioContext();
          if (!ctx) return false;
          if (ctx.state === "suspended") {
            ctx.resume().catch(function() {});
          }
          if (audioBuffer) {
            try {
              var src = ctx.createBufferSource();
              src.buffer = audioBuffer;

              // Dynamics Compressor to maximize loudness cleanly without clipping
              var compressor = ctx.createDynamicsCompressor();
              compressor.threshold.setValueAtTime(-10, ctx.currentTime);
              compressor.knee.setValueAtTime(8, ctx.currentTime);
              compressor.ratio.setValueAtTime(4, ctx.currentTime);
              compressor.attack.setValueAtTime(0.003, ctx.currentTime);
              compressor.release.setValueAtTime(0.25, ctx.currentTime);

              // Amplified Gain Node for high-volume speaker projection
              var gain = ctx.createGain();
              gain.gain.value = 1.35;

              src.connect(compressor);
              compressor.connect(gain);
              gain.connect(ctx.destination);

              src.start(0);
              hasPlayedWithSound = true;
              removeGestureListeners();
              return true;
            } catch (e) {}
          }
          return false;
        }

        function playUnmutedSound() {
          if (hasPlayedWithSound) return;

          var ctx = getAudioContext();
          if (ctx && ctx.state === "suspended") {
            ctx.resume().catch(function() {});
          }

          audio.muted = false;
          audio.volume = 1.0;

          try {
            var p = audio.play();
            if (p && typeof p.then === "function") {
              p.then(function() {
                hasPlayedWithSound = true;
                removeGestureListeners();
              }).catch(function(err) {
                // If direct unmuted play blocked on mobile, try web audio
                if (!playWebAudioBuffer()) {
                  // If web audio also blocked without gesture, start playing muted
                  // so mobile audio pipeline is warm & primed!
                  startMutedWarmup();
                }
              });
            } else {
              hasPlayedWithSound = true;
              removeGestureListeners();
            }
          } catch (e) {
            if (!playWebAudioBuffer()) {
              startMutedWarmup();
            }
          }
        }

        function startMutedWarmup() {
          if (hasPlayedWithSound) return;
          try {
            audio.muted = true;
            audio.play().catch(function() {});
          } catch (e) {}
        }

        // User gesture handler (fires on first touch, scroll, tap anywhere on mobile)
        function onUserInteraction() {
          if (hasPlayedWithSound) {
            removeGestureListeners();
            return;
          }

          var ctx = getAudioContext();
          if (ctx && ctx.state === "suspended") {
            ctx.resume().catch(function() {});
          }

          // Mobile device user interacted! Unmute immediately & reset to beginning so they hear from start!
          audio.muted = false;
          audio.volume = 1.0;
          if (audio.currentTime > 0.1 && audio.currentTime < 5) {
            audio.currentTime = 0;
          }

          try {
            var p = audio.play();
            if (p && typeof p.then === "function") {
              p.then(function() {
                hasPlayedWithSound = true;
                removeGestureListeners();
              }).catch(function() {
                playWebAudioBuffer();
              });
            } else {
              hasPlayedWithSound = true;
              removeGestureListeners();
            }
          } catch (e) {
            playWebAudioBuffer();
          }
        }

        var events = [
          "touchstart", "touchend", "touchmove", "scroll",
          "click", "pointerdown", "pointerup", "mousedown", "keydown"
        ];

        function addGestureListeners() {
          events.forEach(function(evt) {
            window.addEventListener(evt, onUserInteraction, { capture: true, passive: true });
            document.addEventListener(evt, onUserInteraction, { capture: true, passive: true });
          });
        }

        function removeGestureListeners() {
          events.forEach(function(evt) {
            window.removeEventListener(evt, onUserInteraction, { capture: true, passive: true });
            document.removeEventListener(evt, onUserInteraction, { capture: true, passive: true });
          });
        }

        // Attach listeners immediately so any touch, scroll, swipe is intercepted
        addGestureListeners();

        // Check if sound successfully started
        audio.addEventListener("playing", function() {
          if (!audio.muted) {
            hasPlayedWithSound = true;
            removeGestureListeners();
          }
        });

        // Global function for manual / emblem clicks
        window.playQuranAudioOpening = function(forceRestart) {
          if (forceRestart) {
            hasPlayedWithSound = false;
            try { audio.currentTime = 0; } catch (e) {}
          }
          onUserInteraction();
        };

        // Trigger right now
        playUnmutedSound();

        // Retry triggers on document ready, load, pageshow, visibility
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", playUnmutedSound);
        }
        window.addEventListener("load", playUnmutedSound);
        window.addEventListener("pageshow", playUnmutedSound);
        document.addEventListener("visibilitychange", function() {
          if (!document.hidden && !hasPlayedWithSound) {
            playUnmutedSound();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
