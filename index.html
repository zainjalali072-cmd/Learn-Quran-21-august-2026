<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth Quran Academy - Premium Online Quran Learning</title>
    <meta name="description" content="Premium online Quran academy offering Tajweed, Hifz, Arabic, and Islamic studies with certified tutors." />
    <!-- Favicon & Site Icons for Google Search & Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden HTML5 Audio Elements for Maximum Browser Autoplay Compatibility -->
    <audio id="quran-audio-taawwuz" src="/assets/audio/taawwuz.mp3" autoplay playsinline preload="auto" style="display:none"></audio>
    <audio id="quran-audio-bismillah" src="/assets/audio/bismillah.mp3" playsinline preload="auto" style="display:none"></audio>

    <!-- Ta'awwuz & Bismillah Automatic Sequential Audio (Pure Vanilla JS, 0 UI, Autoplay-Guaranteed) -->
    <script>
      (function() {
        // Easily editable audio file paths
        var TAAWWUZ_AUDIO_PATH = "/assets/audio/taawwuz.mp3";
        var BISMILLAH_AUDIO_PATH = "/assets/audio/bismillah.mp3";

        // Preload audio elements
        var taawwuzAudio = document.getElementById("quran-audio-taawwuz") || new Audio(TAAWWUZ_AUDIO_PATH);
        var bismillahAudio = document.getElementById("quran-audio-bismillah") || new Audio(BISMILLAH_AUDIO_PATH);

        taawwuzAudio.preload = "auto";
        bismillahAudio.preload = "auto";
        taawwuzAudio.volume = 0.80; // Clear, calm, respectful volume
        bismillahAudio.volume = 0.80;

        try {
          taawwuzAudio.load();
          bismillahAudio.load();
        } catch (e) {}

        var playbackInitiated = false;
        var bismillahTriggered = false;
        var safetyTimer = null;
        var retryTimer = null;

        function playBismillah() {
          if (bismillahTriggered) return;
          bismillahTriggered = true;
          if (safetyTimer) {
            clearTimeout(safetyTimer);
            safetyTimer = null;
          }
          try {
            bismillahAudio.currentTime = 0;
            var bp = bismillahAudio.play();
            if (bp !== undefined) {
              bp.catch(function() {});
            }
          } catch (e) {}
        }

        // Sequential Playback: When Ta'awwuz recitation ends, immediately play Bismillah
        taawwuzAudio.addEventListener("ended", function() {
          playBismillah();
        });

        // When Ta'awwuz starts playing successfully
        taawwuzAudio.addEventListener("play", function() {
          playbackInitiated = true;
          if (retryTimer) {
            clearInterval(retryTimer);
            retryTimer = null;
          }
          removeGlobalActivityListeners();

          if (!safetyTimer) {
            // Ta'awwuz duration is ~4.18s; safety margin 4.8s
            safetyTimer = setTimeout(function() {
              if (!bismillahTriggered) {
                playBismillah();
              }
            }, 4800);
          }
        });

        function unlockAudioContext() {
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              if (!window._quranAudioCtx) {
                window._quranAudioCtx = new AudioCtx();
              }
              if (window._quranAudioCtx.state === "suspended") {
                window._quranAudioCtx.resume().catch(function() {});
              }
            }
          } catch (e) {}
        }

        function tryPlayTaawwuz() {
          if (playbackInitiated) return;
          unlockAudioContext();

          try {
            var p = taawwuzAudio.play();
            if (p !== undefined) {
              p.then(function() {
                playbackInitiated = true;
                if (retryTimer) {
                  clearInterval(retryTimer);
                  retryTimer = null;
                }
                removeGlobalActivityListeners();
              }).catch(function() {
                // Autoplay blocked by browser policy without gesture.
                // Activity listeners and polling loop will handle it instantly.
              });
            }
          } catch (err) {
            // Handled via activity listeners
          }
        }

        function onActivity() {
          if (playbackInitiated) {
            removeGlobalActivityListeners();
            return;
          }
          unlockAudioContext();
          tryPlayTaawwuz();
        }

        // Comprehensive activity triggers: mouse movement, hover, focus, scroll, touch
        // User DOES NOT have to click anything!
        var activityEvents = [
          "pointerdown", "mousedown", "touchstart", "touchend",
          "click", "keydown", "wheel", "scroll",
          "mousemove", "pointermove", "mouseenter", "mouseover", "focus"
        ];

        function addGlobalActivityListeners() {
          for (var i = 0; i < activityEvents.length; i++) {
            var evt = activityEvents[i];
            window.addEventListener(evt, onActivity, { capture: true, passive: true });
            document.addEventListener(evt, onActivity, { capture: true, passive: true });
          }
          document.addEventListener("visibilitychange", function() {
            if (!document.hidden && !playbackInitiated) {
              onActivity();
            }
          });
        }

        function removeGlobalActivityListeners() {
          for (var i = 0; i < activityEvents.length; i++) {
            var evt = activityEvents[i];
            window.removeEventListener(evt, onActivity, { capture: true, passive: true });
            document.removeEventListener(evt, onActivity, { capture: true, passive: true });
          }
        }

        // Register activity listeners immediately
        addGlobalActivityListeners();

        // Attempt instant playback on script execution, DOM ready, and window load / pageshow
        tryPlayTaawwuz();

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", tryPlayTaawwuz);
        }
        window.addEventListener("load", tryPlayTaawwuz);
        window.addEventListener("pageshow", tryPlayTaawwuz);

        // Micro-retry loop: attempts to play every 150ms until playback starts
        retryTimer = setInterval(function() {
          if (playbackInitiated) {
            clearInterval(retryTimer);
            retryTimer = null;
            return;
          }
          tryPlayTaawwuz();
        }, 150);

        // Clear polling after 12 seconds
        setTimeout(function() {
          if (retryTimer) {
            clearInterval(retryTimer);
            retryTimer = null;
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
