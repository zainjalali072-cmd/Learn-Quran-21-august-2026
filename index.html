<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth Quran Academy - Premium Online Quran Learning</title>
    <meta name="description" content="Premium online Quran academy offering Tajweed, Hifz, Arabic, and Islamic studies with certified tutors." />
    <!-- Favicon & Site Icons for Google Search & Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Bismillah Opening Background Audio (Pure Vanilla JS, 0 UI, Autoplay-Safe) -->
    <script>
      (function() {
        // Easily editable audio path
        var BISMILLAH_AUDIO_PATH = "/assets/audio/bismillah.mp3";
        var SESSION_KEY = "bismillah_played";

        // Prevent repeated playback on SPA navigation or page reloads within the same session
        try {
          if (sessionStorage.getItem(SESSION_KEY) === "true") {
            return;
          }
        } catch (e) {}

        var audio = new Audio(BISMILLAH_AUDIO_PATH);
        audio.preload = "auto";
        audio.volume = 0.65; // Soft, calm and respectful volume

        var isPlayed = false;

        function markPlayed() {
          if (isPlayed) return;
          isPlayed = true;
          try {
            sessionStorage.setItem(SESSION_KEY, "true");
          } catch (e) {}
        }

        // Attempt background autoplay immediately as website loads
        function attemptPlay() {
          if (isPlayed) return;
          var promise = audio.play();
          if (promise !== undefined) {
            promise
              .then(function() {
                markPlayed();
                cleanupListeners();
              })
              .catch(function() {
                // Autoplay blocked by browser policy without user gesture.
                // Do NOT show any popup, overlay, button or visual elements.
                // The website loads normally as intended.
              });
          }
        }

        // Organic fallback: if autoplay was blocked by browser policy,
        // play silently once upon the visitor's first organic touch/click anywhere on the website
        function onFirstUserGesture() {
          if (!isPlayed) {
            var promise = audio.play();
            if (promise !== undefined) {
              promise
                .then(function() {
                  markPlayed();
                })
                .catch(function() {});
            }
          }
          cleanupListeners();
        }

        function cleanupListeners() {
          window.removeEventListener("click", onFirstUserGesture, true);
          window.removeEventListener("touchstart", onFirstUserGesture, true);
          window.removeEventListener("keydown", onFirstUserGesture, true);
        }

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", attemptPlay);
        } else {
          attemptPlay();
        }

        window.addEventListener("click", onFirstUserGesture, { capture: true, once: true });
        window.addEventListener("touchstart", onFirstUserGesture, { capture: true, once: true });
        window.addEventListener("keydown", onFirstUserGesture, { capture: true, once: true });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
