<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth Quran Academy - Premium Online Quran Learning</title>
    <meta name="description" content="Premium online Quran academy offering Tajweed, Hifz, Arabic, and Islamic studies with certified tutors." />
    <!-- Favicon & Site Icons for Google Search & Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden HTML5 Audio Element for Maximum Browser & Mobile Autoplay Compatibility -->
    <audio id="quran-audio-opening" src="/assets/audio/taawwuz_bismillah.mp3" preload="auto" playsinline webkit-playsinline="true" x5-playsinline="true" style="position:fixed;top:-9999px;left:-9999px;opacity:0.01;pointer-events:none;"></audio>

    <!-- Taawwuz & Bismillah Opening Recitation (Rock-Solid for Mobile & PC/Laptop) -->
    <script>
      (function() {
        var OPENING_AUDIO_PATH = "/assets/audio/taawwuz_bismillah.mp3";
        var TAAWWUZ_AUDIO_PATH = "/assets/audio/taawwuz.mp3";
        var BISMILLAH_AUDIO_PATH = "/assets/audio/bismillah.mp3";

        var audio = document.getElementById("quran-audio-opening");
        if (!audio) {
          audio = new Audio(OPENING_AUDIO_PATH);
          audio.id = "quran-audio-opening";
          audio.style.cssText = "position:fixed;top:-9999px;left:-9999px;opacity:0.01;pointer-events:none;";
          document.body.appendChild(audio);
        }

        audio.preload = "auto";
        audio.setAttribute("playsinline", "true");
        audio.setAttribute("webkit-playsinline", "true");
        audio.setAttribute("x5-playsinline", "true");
        try {
          audio.volume = 0.85;
        } catch (e) {}

        var hasStarted = false;
        var audioCtx = null;
        var preloadedBuffer = null;

        // Initialize Web Audio Context (industry standard for iOS Safari & Android mobile audio unlock)
        function getAudioContext() {
          if (!audioCtx) {
            var AudioContextClass = window.AudioContext || window.webkitAudioContext;
            if (AudioContextClass) {
              try {
                audioCtx = new AudioContextClass();
                window._quranAudioCtx = audioCtx;
              } catch (e) {}
            }
          }
          return audioCtx;
        }

        // Silent buffer unlock for mobile WebKit audio pipeline
        function unlockAudioPipeline(ctx) {
          if (!ctx) return;
          try {
            if (ctx.state === "suspended") {
              ctx.resume().catch(function() {});
            }
            var silentBuf = ctx.createBuffer(1, 1, 22050);
            var src = ctx.createBufferSource();
            src.buffer = silentBuf;
            src.connect(ctx.destination);
            src.start(0);
          } catch (e) {}
        }

        // Preload audio arraybuffer in background for instant 0ms mobile playback
        if (typeof fetch === "function") {
          fetch(OPENING_AUDIO_PATH)
            .then(function(res) {
              if (res.ok) return res.arrayBuffer();
              throw new Error("fetch failed");
            })
            .then(function(ab) {
              var ctx = getAudioContext();
              if (ctx && ctx.decodeAudioData) {
                ctx.decodeAudioData(ab.slice(0), function(decoded) {
                  preloadedBuffer = decoded;
                }, function() {});
              }
            })
            .catch(function() {});
        }

        // Automatic fallback transition if separate taawwuz.mp3 is loaded
        audio.addEventListener("ended", function() {
          if (audio.src && audio.src.indexOf("taawwuz.mp3") !== -1) {
            audio.src = BISMILLAH_AUDIO_PATH;
            audio.play().catch(function() {});
          }
        });

        function playViaWebAudio() {
          var ctx = getAudioContext();
          if (ctx && preloadedBuffer) {
            try {
              unlockAudioPipeline(ctx);
              var source = ctx.createBufferSource();
              source.buffer = preloadedBuffer;
              var gain = ctx.createGain();
              gain.gain.value = 0.85;
              source.connect(gain);
              gain.connect(ctx.destination);
              source.start(0);
              hasStarted = true;
              cleanupListeners();
              return true;
            } catch (e) {}
          }
          return false;
        }

        function executePlayback() {
          if (hasStarted) return;

          var ctx = getAudioContext();
          if (ctx) {
            unlockAudioPipeline(ctx);
          }

          try {
            var playPromise = audio.play();
            if (playPromise && typeof playPromise.then === "function") {
              playPromise
                .then(function() {
                  hasStarted = true;
                  cleanupListeners();
                })
                .catch(function(err) {
                  // If HTML5 audio is blocked without user gesture, try Web Audio buffer
                  if (playViaWebAudio()) {
                    return;
                  }
                  // Keep listeners active so first user tap on mobile screen will start it!
                });
            } else {
              hasStarted = true;
              cleanupListeners();
            }
          } catch (e) {
            if (playViaWebAudio()) {
              return;
            }
          }
        }

        // Global manual or emblem trigger
        window.playQuranAudioOpening = function(forceRestart) {
          if (forceRestart) {
            hasStarted = false;
            try {
              audio.currentTime = 0;
            } catch (e) {}
          }
          executePlayback();
        };

        // User gesture handler on mobile & desktop
        function onUserGesture() {
          if (hasStarted) {
            cleanupListeners();
            return;
          }
          executePlayback();
        }

        // High priority touch and click events supported across iOS Safari and Android Chrome
        var gestureEvents = [
          "touchend", "click", "pointerup", "touchstart", "keydown"
        ];

        function attachListeners() {
          gestureEvents.forEach(function(evt) {
            window.addEventListener(evt, onUserGesture, { capture: true, passive: true });
            document.addEventListener(evt, onUserGesture, { capture: true, passive: true });
          });
        }

        function cleanupListeners() {
          gestureEvents.forEach(function(evt) {
            window.removeEventListener(evt, onUserGesture, { capture: true, passive: true });
            document.removeEventListener(evt, onUserGesture, { capture: true, passive: true });
          });
        }

        // Attach listeners immediately
        attachListeners();

        // 1. Immediate play attempt (works on PC/laptop & permissive mobile webviews)
        executePlayback();

        // 2. Play attempt on DOMContentLoaded
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", executePlayback);
        }

        // 3. Play attempt on window load
        window.addEventListener("load", executePlayback);

        // 4. Play attempt on pageshow (handles mobile Safari bfcache)
        window.addEventListener("pageshow", executePlayback);

        // 5. Play attempt on tab visibility change
        document.addEventListener("visibilitychange", function() {
          if (!document.hidden && !hasStarted) {
            executePlayback();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
