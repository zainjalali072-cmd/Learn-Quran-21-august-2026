<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth Quran Academy - Premium Online Quran Learning</title>
    <meta name="description" content="Premium online Quran academy offering Tajweed, Hifz, Arabic, and Islamic studies with certified tutors." />
    <!-- Favicon & Site Icons for Google Search & Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden HTML5 Audio Element for Maximum Browser & Mobile Autoplay Compatibility -->
    <audio id="quran-audio-opening" src="/assets/audio/taawwuz_bismillah.mp3" autoplay playsinline webkit-playsinline="true" x5-playsinline="true" preload="auto" style="display:none"></audio>

    <!-- Taawwuz & Bismillah Automatic Opening Recitation (Mobile & Desktop Optimized) -->
    <script>
      (function() {
        // Easily editable audio file paths
        var OPENING_AUDIO_PATH = "/assets/audio/taawwuz_bismillah.mp3";
        var TAAWWUZ_AUDIO_PATH = "/assets/audio/taawwuz.mp3";
        var BISMILLAH_AUDIO_PATH = "/assets/audio/bismillah.mp3";

        var audio = document.getElementById("quran-audio-opening") || new Audio(OPENING_AUDIO_PATH);
        audio.preload = "auto";
        audio.volume = 0.80; // Clear, calm, respectful volume
        audio.setAttribute("playsinline", "true");
        audio.setAttribute("webkit-playsinline", "true");
        audio.setAttribute("x5-playsinline", "true");

        // Force browser to start downloading and buffering immediately
        try {
          audio.load();
        } catch (e) {}

        var hasStarted = false;

        // If the audio source is separate taawwuz.mp3, automatically transition to bismillah.mp3 on ended
        audio.addEventListener("ended", function() {
          if (audio.src && audio.src.indexOf("taawwuz.mp3") !== -1) {
            audio.src = BISMILLAH_AUDIO_PATH;
            audio.play().catch(function() {});
          }
        });

        function startAudio() {
          if (hasStarted) return;

          // Unlock Web Audio Context if available
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              if (!window._quranAudioCtx) {
                window._quranAudioCtx = new AudioCtx();
              }
              if (window._quranAudioCtx.state === "suspended") {
                window._quranAudioCtx.resume().catch(function() {});
              }
            }
          } catch (e) {}

          try {
            var playPromise = audio.play();
            if (playPromise !== undefined) {
              playPromise
                .then(function() {
                  hasStarted = true;
                  cleanupActivationListeners();
                })
                .catch(function() {
                  // If unprompted autoplay was blocked by browser policy without gesture,
                  // do NOT show any popup/overlay.
                  // The activation listeners will smoothly start playback on the user's first natural screen touch or key.
                });
            }
          } catch (e) {}
        }

        // Synchronous execution on first user gesture (essential for iOS Safari & Android Chrome)
        function onUserActivation() {
          if (hasStarted) {
            cleanupActivationListeners();
            return;
          }
          hasStarted = true;
          cleanupActivationListeners();

          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx && window._quranAudioCtx && window._quranAudioCtx.state === "suspended") {
              window._quranAudioCtx.resume().catch(function() {});
            }
          } catch (e) {}

          try {
            audio.play().catch(function() {});
          } catch (e) {}
        }

        var activationEvents = [
          "touchstart", "touchend", "pointerdown", "mousedown",
          "keydown", "click", "scroll"
        ];

        function attachActivationListeners() {
          for (var i = 0; i < activationEvents.length; i++) {
            var evt = activationEvents[i];
            window.addEventListener(evt, onUserActivation, { capture: true, once: true, passive: true });
            document.addEventListener(evt, onUserActivation, { capture: true, once: true, passive: true });
          }
        }

        function cleanupActivationListeners() {
          for (var i = 0; i < activationEvents.length; i++) {
            var evt = activationEvents[i];
            window.removeEventListener(evt, onUserActivation, { capture: true, passive: true });
            document.removeEventListener(evt, onUserActivation, { capture: true, passive: true });
          }
        }

        // Attach listeners immediately so any touch or scroll is caught
        attachActivationListeners();

        // 1. Immediate attempt right as script evaluates
        startAudio();

        // 2. Attempt as soon as DOM is ready
        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", startAudio);
        }

        // 3. Attempt on window load
        window.addEventListener("load", startAudio);

        // 4. Attempt on pageshow (handles back-forward cache and tab switches)
        window.addEventListener("pageshow", startAudio);

        // 5. Visibility change (when tab becomes active)
        document.addEventListener("visibilitychange", function() {
          if (!document.hidden && !hasStarted) {
            startAudio();
          }
        });
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
