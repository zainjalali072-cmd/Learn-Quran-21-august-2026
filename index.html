<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Truth Quran Academy - Premium Online Quran Learning</title>
    <meta name="description" content="Premium online Quran academy offering Tajweed, Hifz, Arabic, and Islamic studies with certified tutors." />
    <!-- Favicon & Site Icons for Google Search & Browsers -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="shortcut icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <!-- Preconnect for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <!-- Ta'awwuz & Bismillah Automatic Sequential Audio (Pure Vanilla JS, 0 UI, Autoplay-Guaranteed) -->
    <script>
      (function() {
        // Easily editable audio file paths
        var TAAWWUZ_AUDIO_PATH = "/assets/audio/taawwuz.mp3";
        var BISMILLAH_AUDIO_PATH = "/assets/audio/bismillah.mp3";

        // Preload audio objects with buffering
        var taawwuzAudio = new Audio(TAAWWUZ_AUDIO_PATH);
        var bismillahAudio = new Audio(BISMILLAH_AUDIO_PATH);

        taawwuzAudio.preload = "auto";
        bismillahAudio.preload = "auto";
        taawwuzAudio.volume = 0.75; // Calm, clear, respectful volume
        bismillahAudio.volume = 0.75;

        // Force browser to start downloading and buffering both recitations immediately
        taawwuzAudio.load();
        bismillahAudio.load();

        var playbackInitiated = false;
        var bismillahTriggered = false;
        var safetyTimer = null;

        function playBismillah() {
          if (bismillahTriggered) return;
          bismillahTriggered = true;
          if (safetyTimer) {
            clearTimeout(safetyTimer);
            safetyTimer = null;
          }
          try {
            bismillahAudio.currentTime = 0;
            var bp = bismillahAudio.play();
            if (bp !== undefined) {
              bp.catch(function() {});
            }
          } catch (e) {}
        }

        // Sequential Playback: When Ta'awwuz recitation ends, immediately play Bismillah
        taawwuzAudio.addEventListener("ended", function() {
          playBismillah();
        });

        // Safety fallback transition in case ended event drops or is delayed
        taawwuzAudio.addEventListener("play", function() {
          if (!safetyTimer) {
            // Ta'awwuz duration is ~4.18s; safety margin 4.8s
            safetyTimer = setTimeout(function() {
              if (!bismillahTriggered) {
                playBismillah();
              }
            }, 4800);
          }
        });

        function unlockAudioContext() {
          try {
            var AudioCtx = window.AudioContext || window.webkitAudioContext;
            if (AudioCtx) {
              if (!window._quranAudioCtx) {
                window._quranAudioCtx = new AudioCtx();
              }
              if (window._quranAudioCtx.state === "suspended") {
                window._quranAudioCtx.resume().catch(function() {});
              }
            }
          } catch (e) {}
        }

        function tryPlayTaawwuz() {
          if (playbackInitiated) return;
          unlockAudioContext();

          try {
            var p = taawwuzAudio.play();
            if (p !== undefined) {
              p.then(function() {
                playbackInitiated = true;
                removeGlobalInteractionListeners();
              }).catch(function(err) {
                // Autoplay blocked by browser policy without gesture.
                // Interaction listeners remain active and will trigger instantly on any user touch/scroll/click.
              });
            }
          } catch (err) {
            // Handled via interaction listeners
          }
        }

        function onUserInteraction() {
          if (playbackInitiated) {
            removeGlobalInteractionListeners();
            return;
          }
          playbackInitiated = true;
          removeGlobalInteractionListeners();
          unlockAudioContext();

          try {
            taawwuzAudio.currentTime = 0;
            var p = taawwuzAudio.play();
            if (p !== undefined) {
              p.catch(function() {});
            }
          } catch (e) {}
        }

        var interactionEvents = [
          "pointerdown", "mousedown", "touchstart", "touchend",
          "click", "keydown", "wheel", "scroll"
        ];

        function addGlobalInteractionListeners() {
          for (var i = 0; i < interactionEvents.length; i++) {
            var evt = interactionEvents[i];
            window.addEventListener(evt, onUserInteraction, { capture: true, passive: true });
            document.addEventListener(evt, onUserInteraction, { capture: true, passive: true });
          }
        }

        function removeGlobalInteractionListeners() {
          for (var i = 0; i < interactionEvents.length; i++) {
            var evt = interactionEvents[i];
            window.removeEventListener(evt, onUserInteraction, { capture: true, passive: true });
            document.removeEventListener(evt, onUserInteraction, { capture: true, passive: true });
          }
        }

        // Register interaction listeners immediately
        addGlobalInteractionListeners();

        // Attempt instant playback on script execution, DOM ready, and window load / pageshow
        tryPlayTaawwuz();

        if (document.readyState === "loading") {
          document.addEventListener("DOMContentLoaded", tryPlayTaawwuz);
        }
        window.addEventListener("load", tryPlayTaawwuz);
        window.addEventListener("pageshow", tryPlayTaawwuz);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
